name: Windows validation and development releases

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a development release after successful validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      MSBUILDDISABLENODEREUSE: '1'
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test CPU components
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -E "^(d3d12_|native_submission_lifecycle$|material_cli_)" --output-junit "${{ runner.temp }}/ctest-${{ matrix.architecture }}.xml"
      - name: Test release packaging
        run: python -I -B -Werror -m unittest discover -s tools/release/tests -p "test_*.py"
      - name: Package x64 inspection tools with CPack
        if: matrix.architecture == 'x64'
        run: |
          $cpack = (Get-Command cpack -ErrorAction Stop).Source
          & $cpack --version
          if ($LASTEXITCODE -ne 0) { throw 'CPack is unavailable' }
          python -I -B tools/release/package_devtools.py --repo . --build-dir build --output-dir "$env:RUNNER_TEMP/oahu-package" --ctest-report "$env:RUNNER_TEMP/ctest-x64.xml" --cpack $cpack
          if ($LASTEXITCODE -ne 0) { throw 'CPack packaging failed' }
      - name: Validate complete v2 package before upload
        if: matrix.architecture == 'x64'
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: python -I -B tools/release/check_package.py --source "$env:EXPECTED_SOURCE" --package-dir "$env:RUNNER_TEMP/oahu-package"
      - name: Upload verified x64 package
        if: matrix.architecture == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oahu-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/oahu-package/*.zip
            ${{ runner.temp }}/oahu-package/manifest.json
            ${{ runner.temp }}/oahu-package/SHA256SUMS.txt

  publish:
    name: Publish development snapshot
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oahu-windows-x64
          path: dist
      - name: Revalidate downloaded v2 package before publication
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: python -I -B tools/release/check_package.py --source "$env:EXPECTED_SOURCE" --package-dir dist
      - name: Publish immutable development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I tools/release/publish_release.py --repository "${{ github.repository }}" --source "${{ github.sha }}" --package-dir dist
